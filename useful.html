<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="backdrop" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="orb orb-d"></div>
    <div class="grid-lines"></div>
    <div class="grain"></div>
  </div>

  <!-- language switcher: EN / كوردی -->
  <button class="lang-btn" id="lang-btn" type="button" aria-label="Switch language">
    <span class="flag" id="lang-flag"></span>
    <span class="mono" id="lang-code">KU</span>
  </button>

  <main class="page">

    <nav class="topbar reveal">
      <a class="back" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        <span data-i18n="backHome">Home</span>
      </a>
    </nav>

    <header class="intro reveal">
      <h1 class="detail-title" data-i18n="usefulTitle">Useful Content</h1>
      <p class="intro-sub" data-i18n="usefulSub">resources &middot; tools &middot; links worth sharing</p>
    </header>

    <section aria-labelledby="store-title">
      <div class="section-head">
        <h2 id="store-title" data-i18n="linkStore">Link Store</h2>
        <span class="rule"></span>
      </div>
      <div class="store-grid" id="link-store"><!-- auto-generated by script.js from LINK_STORE --></div>
    </section>

    <section aria-labelledby="resources-title">
      <div class="section-head">
        <h2 id="resources-title" data-i18n="resources">Resources</h2>
        <span class="rule"></span>
      </div>

      <a class="useful-card reveal" href="https://developer.mozilla.org" target="_blank" rel="noopener">
        <div>
          <h3>MDN Web Docs</h3>
          <p data-i18n="mdnDesc">The best reference for HTML, CSS and JavaScript.</p>
        </div>
        <span class="arrow" aria-hidden="true">&#8599;</span>
      </a>

      <!-- TODO: add more resource cards here if you want (copy the MDN card above) -->
      <a class="useful-card reveal" href="https://tlauncher.org/" target="_blank" rel="noopener">
        <div>
          <h3>Minecraft</h3>
          <p data-i18n="mcDesc">Minecraft website — download, play and build.</p>
        </div>
        <span class="arrow" aria-hidden="true">&#8599;</span>
      </a>
    </section>

    <footer class="site-footer reveal">
      <p class="copyright" data-i18n="copyright">&copy; 2026 Harzheen Hawzheen &mdash; All rights reserved.</p>
    </footer>
