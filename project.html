<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project | Harzheen Hawzheen</title>
  <meta name="description" content="Project details.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="backdrop" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="orb orb-d"></div>
    <div class="grid-lines"></div>
    <div class="grain"></div>
  </div>

  <!-- language switcher: EN / كوردی -->
  <button class="lang-btn" id="lang-btn" type="button" aria-label="Switch language">
    <span class="flag" id="lang-flag"></span>
    <span class="mono" id="lang-code">KU</span>
  </button>

  <main class="page">

    <nav class="topbar reveal">
      <a class="back" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        <span data-i18n="backHome">Home</span>
      </a>
    </nav>

    <article class="detail reveal">
      <div class="detail-thumb">
        <img id="project-image" src="" alt="">
      </div>
      <h1 class="detail-title" id="project-title"></h1>
      <p class="detail-tagline" id="project-tagline"></p>
      <div class="detail-meta" id="project-meta"><!-- role / status, rendered by script.js --></div>
      <div class="tags" id="project-tags"></div>
      <div class="detail-body" id="project-body"></div>
      <section id="project-features"></section>
      <section id="preview-section">
        <div class="section-head">
          <h2 id="previews-title" data-i18n="previewsTitle">Previews</h2>
          <span class="rule"></span>
        </div>
        <div class="preview-wrap" id="project-previews"><!-- auto-generated by script.js from PROJECTS[n].previews --></div>
      </section>
      <div class="detail-actions">
        <a id="project-link" class="useful-btn" href="#">
          Open Project
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <a id="project-code" class="btn-outline" href="#">
          View Code
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/></svg>
        </a>
      </div>
    </article>

    <footer class="site-footer reveal">
      <p class="copyright">&copy; 2026 Harzheen Hawzheen &mdash; All rights reserved.</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
